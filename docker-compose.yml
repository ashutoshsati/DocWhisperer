services:
  app:
    build: .
    image: rag-chatbot:latest
    container_name: rag-chatbot
    ports:
      # Host port 80 -> container port 7860 (HF Spaces Docker SDK expects 7860)
      - "80:7860"
    env_file: ./.env
    volumes:
      # Persist ChromaDB across container restarts and rebuilds
      - ./vector_store:/app/vector_store
    restart: unless-stopped
